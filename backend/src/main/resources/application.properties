spring.application.name=backend
server.port=8080

# ---------------------------------------------------------------------------
# Database (PostgreSQL). Credentials are NOT stored in this file any more.
# Set these environment variables (or put them in application-local.properties, which is git-ignored):
#   DB_URL       e.g. jdbc:postgresql://<host>/<db>?sslmode=require
#   DB_USERNAME
#   DB_PASSWORD
# The defaults below point at a local PostgreSQL for development.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/befit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate adds the new tables/columns on start and never drops anything (ddl-auto=update).
# docs/migrations/V2__multi_branch_billing.sql is the same change as plain SQL, plus FK / unique constraints.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# Must be 32+ characters. Set JWT_SECRET in any real deployment (the default below is for local development only).
jwt.secret=${JWT_SECRET:befit-dev-secret-change-me-before-deploying-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Comma separated list of browser origins allowed to call the API
befit.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
# Business switches
# ---------------------------------------------------------------------------
# true  = a patient's branch change is a request that the receiving branch's receptionist (or an admin) must approve
# false = the change is applied immediately (the behaviour before this version)
befit.transfer.approval-required=true
# Safety caps so "Print All" / "Export to Excel" cannot load an unbounded number of rows
befit.billing.report-max-rows=5000
befit.billing.export-max-rows=20000

# Creates demo staff / patients / appointments / invoices for every branch on first start (idempotent).
# Set to false in production.
befit.seed.demo-data=${SEED_DEMO_DATA:true}

# Optional local overrides (not committed): create backend/src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties

# BEFIT-23: how many days after a visit is COMPLETED the branch that received the patient keeps "temporary visit" access
befit.access.temporary-visit-grace-days=3

# BEFIT-26 transfer rules
# true = unpaid/partly paid invoices BLOCK a transfer; false (default) = they are a warning the approver must acknowledge
befit.transfer.block-on-outstanding-invoices=false
# false (default) = whoever raised a transfer request cannot also approve/reject it
befit.transfer.allow-self-approval=false

# BEFIT-29 who may approve/reject a transfer
# true (default) = only the destination branch's BRANCH_MANAGER or an ADMIN decides; receptionists may only raise / withdraw requests
# false          = the destination branch's receptionist may decide too (managers and admins still can)
befit.transfer.manager-approval-required=true

# BEFIT-32 patient portal access: how long a front-desk activation link stays valid (hours)
befit.portal.invitation-hours=48
